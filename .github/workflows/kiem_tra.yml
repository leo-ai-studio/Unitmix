name: Kiểm tra

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Kiểu (tsc)
        run: npx tsc --noEmit
        working-directory: web
      - name: Test worker
        run: npx vitest run
        working-directory: worker
      - name: Test quy tắc, thư viện (pytest)
        run: |
          python -m pip install pytest
          python -m pytest tests -q
      - name: Dựng web
        run: npm run build
      # Test web (vitest) có bài quét tệp CAD trên đĩa máy chủ nhiệm — chạy ở máy: npm run kiem
