name = "unitmix"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Gắn tên miền riêng khi zone leo-ai.dev đã có trong tài khoản Cloudflare:
# routes = [{ pattern = "unitmix.leo-ai.dev", custom_domain = true }]

# Một Worker phục vụ cả giao diện (web/dist) lẫn API: /api/* vào Worker, còn lại là tệp tĩnh (SPA).
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "unitmix"
database_id = "a703077d-cc4e-4d77-819d-dd18108bc00d"
migrations_dir = "migrations"

# Trạm chuyển Leo AI cho điện thoại (src/tram.ts): cầu trên máy tính nối WebSocket vào, điện thoại hỏi qua https
[[durable_objects.bindings]]
name = "TRAM"
class_name = "Tram"

[[migrations]]
tag = "v1-tram"
new_sqlite_classes = ["Tram"]

# Đăng nhập mail công ty để tạo dự án (docs/dang_nhap_cloudflare.md).
[vars]
CF_ACCESS_TEAM = "lively-darkness-9f3f"
CF_ACCESS_AUD = "26f6ed019fd63a0ee4172e9474f4904b4516f644fd7f2473a19ad86c4fb88faf"
MIEN_TAO_DA = "meygroup.vn"
